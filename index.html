<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b09">
<title>The Block — Draft Assist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Spline+Sans+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #070b09; --panel: #0e1512; --panel2: #15201b; --line: #24312a;
    --fg: #e8f2ec; --dim: #7d8f86; --money: #f5c84c; --go: #2eea8b;
    --stop: #ff5d5d; --hold: #ffb454;
    --qb:#ff7ad9; --rb:#2eea8b; --wr:#5ac8ff; --te:#ffb454; --k:#7d8f86; --dst:#7d8f86;
    --cond: "Barlow Condensed", "Avenir Next Condensed", sans-serif;
    --mono: "Spline Sans Mono", ui-monospace, "SF Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--ink); }
  body { margin:0; color:var(--fg); font: 15px/1.4 var(--mono);
    background:
      radial-gradient(120% 55% at 50% -10%, rgba(46,234,139,.07), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 47px, rgba(232,242,236,.025) 47px 48px),
      var(--ink);
    padding-bottom: calc(66px + env(safe-area-inset-bottom)); }

  /* ---------- status board ---------- */
  #statusbar { position:sticky; top:0; z-index:10; background:rgba(14,21,18,.92);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
    padding:9px 14px 7px; padding-top: calc(9px + env(safe-area-inset-top));
    display:flex; gap:14px; align-items:baseline; }
  .st { display:flex; flex-direction:column; gap:0; }
  .st .n { font:700 17px/1 var(--mono); color:var(--money); letter-spacing:-.02em; }
  .st .l { font:700 9px/1.6 var(--cond); color:var(--dim); text-transform:uppercase; letter-spacing:.18em; }
  .st.plain .n { color:var(--fg); }
  .spacer { flex:1; }
  #draftstate { font:700 11px/1 var(--cond); color:var(--dim); text-transform:uppercase; letter-spacing:.14em;
    display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--stop); flex:none; }
  .dot.ok { background:var(--go); box-shadow:0 0 6px var(--go); }

  #err { color:var(--stop); font-size:11px; padding:4px 14px; display:none; }

  /* ---------- ON THE BLOCK lower-third ---------- */
  #block { display:none; margin:12px 12px 0; position:relative; overflow:hidden;
    background: linear-gradient(100deg, var(--panel2) 0%, var(--panel) 70%);
    border:1px solid var(--line); border-left:4px solid var(--go);
    border-radius: 4px 14px 14px 4px; padding:10px 14px 11px;
    animation: lowerthird .35s cubic-bezier(.2,.9,.3,1.2); }
  #block.show { display:block; }
  @keyframes lowerthird { from { transform:translateY(-14px); opacity:0; } to { transform:none; opacity:1; } }
  #block::before { content:""; position:absolute; inset:0 auto 0 0; width:120px;
    background: linear-gradient(100deg, rgba(46,234,139,.09), transparent 75%); pointer-events:none; }
  .livetag { display:inline-flex; align-items:center; gap:5px;
    font:800 10px/1 var(--cond); letter-spacing:.24em; text-transform:uppercase; color:var(--go); }
  .livetag::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--stop);
    animation: blink 1.1s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #block .toprow { display:flex; align-items:baseline; gap:10px; margin-top:2px; }
  #block .bname { font:800 27px/1.05 var(--cond); letter-spacing:.01em; text-transform:uppercase;
    flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #block .bid { font:700 26px/1 var(--mono); color:var(--money); letter-spacing:-.03em; }
  #block .verdict { font:800 14px/1 var(--cond); letter-spacing:.08em; padding:5px 10px 4px;
    border-radius:3px; transform: skewX(-8deg); text-transform:uppercase; }
  #block .verdict.BID { background:var(--go); color:#04140b; box-shadow:0 0 14px rgba(46,234,139,.45); }
  #block .verdict.PASS { background:var(--stop); color:#1c0505; }
  #block .verdict.MAX { background:var(--hold); color:#1c1002; }
  #block .verdict.SOLD { background:var(--line); color:var(--dim); }
  #block .sub2 { font:500 10.5px/1.5 var(--mono); color:var(--dim); margin-top:4px;
    text-transform:uppercase; letter-spacing:.04em; }

  /* ---------- search ---------- */
  .wrap { padding:12px 12px 8px; }
  #view-search .wrap { position:sticky; top:calc(env(safe-area-inset-top) + 43px); z-index:9;
    background:linear-gradient(var(--ink) 78%, transparent); }
  #search { width:100%; padding:12px 14px 11px; font:500 17px/1 var(--mono); background:var(--panel);
    color:var(--fg); border:1px solid var(--line); border-radius:10px; outline:none; caret-color:var(--go); }
  #search::placeholder { color:var(--dim); }
  #search:focus { border-color:var(--go); box-shadow:0 0 0 1px var(--go); }

  /* ---------- player rows ---------- */
  .row { display:flex; align-items:center; gap:11px; padding:9px 14px 8px;
    border-bottom:1px solid rgba(36,49,42,.55); }
  .row:active { background:var(--panel2); }
  .pos { font:800 12px/1 var(--cond); letter-spacing:.06em; width:36px; flex:none; text-align:center;
    padding:5px 0 4px; border-radius:3px; background:var(--panel2); }
  .pos.QB{color:var(--qb)} .pos.RB{color:var(--rb)} .pos.WR{color:var(--wr)}
  .pos.TE{color:var(--te)} .pos.K,.pos.DST{color:var(--k)}
  .pname { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font:700 17.5px/1.15 var(--cond); letter-spacing:.015em; }
  .pname small { display:block; font:500 9.5px/1.5 var(--mono); color:var(--dim);
    text-transform:uppercase; letter-spacing:.05em; }
  .val { text-align:right; font:700 17px/1.1 var(--mono); color:var(--money); letter-spacing:-.02em; }
  .val small { display:block; font:400 9.5px/1.5 var(--mono); color:var(--dim); }
  .taken { opacity:.4; }
  .taken .val { color:var(--stop); font-size:13px; }
  .inj { color:var(--stop); font:700 10px/1 var(--mono); margin-left:5px; vertical-align:2px; }
  .meters { flex:none; display:flex; flex-direction:column; gap:3px; align-items:flex-end; }
  .pips { display:flex; gap:2.5px; }
  .pips b { width:5px; height:5px; border-radius:50%; background:rgba(125,143,134,.28); }
  .pips.up b.on { background:var(--go); box-shadow:0 0 3px rgba(46,234,139,.5); }
  .pips.bust b.on { background:var(--stop); box-shadow:0 0 3px rgba(255,93,93,.5); }
  .statpips { display:flex; justify-content:center; gap:2.5px; margin-top:2px; }
  .statpips b { width:5px; height:5px; border-radius:50%; background:rgba(125,143,134,.28); }
  .statpips.up b.on { background:var(--go); }
  .statpips.bust b.on { background:var(--stop); }
  .noresult { padding:26px 14px; text-align:center; font:500 13px var(--mono); color:var(--dim); }
  .btnrow { display:flex; gap:8px; margin-top:12px; }
  .btnrow input { width:86px; text-align:center; font:700 18px var(--mono); color:var(--money);
    background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:11px 6px 10px; outline:none; }
  .btnrow input:focus { border-color:var(--money); }
  .abtn { flex:1; border:none; border-radius:10px; padding:12px 4px 11px;
    font:800 14px/1 var(--cond); letter-spacing:.1em; text-transform:uppercase; }
  .abtn.mine { background:var(--go); color:#04140b; }
  .abtn.other { background:var(--panel2); color:var(--fg); border:1px solid var(--line); }
  .abtn.undo { background:var(--stop); color:#1c0505; }
  .manualtag { font:700 10px var(--mono); color:var(--hold); }
  .mrow { display:flex; align-items:center; gap:9px; padding:8px 10px 7px; border-bottom:1px solid rgba(36,49,42,.55); }
  .mrow .mn { flex:1; font:700 16px var(--cond); letter-spacing:.02em; }
  .mrow .tag { font:800 9px/1 var(--cond); letter-spacing:.14em; padding:4px 7px 3px; border-radius:3px; }
  .mrow .tag.mine { background:rgba(46,234,139,.15); color:var(--go); }
  .mrow .tag.other { background:rgba(255,180,84,.15); color:var(--hold); }
  .mrow .ma { font:700 14px var(--mono); color:var(--money); }
  .mrow .mx { font:800 15px/1 var(--cond); color:var(--stop); padding:6px 10px; background:var(--panel2);
    border-radius:6px; border:1px solid var(--line); }
  .syncbtn { width:100%; margin-top:14px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel2); color:var(--fg); padding:13px 4px 12px;
    font:800 14px/1 var(--cond); letter-spacing:.14em; text-transform:uppercase; }
  .syncbtn:active { background:var(--line); }
  .stat .n.up { color:var(--go); }
  .stat .n.bust { color:var(--stop); }

  /* ---------- player card (bottom sheet) ---------- */
  #card { position:fixed; inset:0; z-index:20; background:rgba(4,7,5,.72); display:none; }
  #card.open { display:flex; align-items:flex-end; }
  #cardbody { background:var(--panel); width:100%; border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:16px 16px calc(26px + env(safe-area-inset-bottom));
    animation: sheet .28s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes sheet { from { transform:translateY(40px); opacity:.4; } to { transform:none; opacity:1; } }
  #cardbody::before { content:""; display:block; width:36px; height:4px; border-radius:2px;
    background:var(--line); margin:0 auto 12px; }
  #cardbody h2 { margin:0; font:800 30px/1 var(--cond); text-transform:uppercase; letter-spacing:.01em; }
  #cardbody .sub { font:500 10.5px/1.6 var(--mono); color:var(--dim); text-transform:uppercase;
    letter-spacing:.08em; margin:3px 0 13px; }
  .bigbid { position:relative; overflow:hidden; background:var(--panel2); border:1px solid var(--line);
    border-radius:14px; padding:13px 14px 11px; text-align:center; margin-bottom:12px; }
  .bigbid::after { content:""; position:absolute; inset:auto 0 0 0; height:2px;
    background:linear-gradient(90deg, transparent, var(--go), transparent); }
  .bigbid .n { font:800 52px/1 var(--cond); color:var(--go); letter-spacing:-.01em;
    text-shadow:0 0 22px rgba(46,234,139,.35); }
  .bigbid .l { font:700 9.5px/2 var(--cond); color:var(--dim); text-transform:uppercase; letter-spacing:.22em; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:11px; }
  .stat { background:var(--panel2); border-radius:9px; padding:8px 4px 6px; text-align:center; }
  .stat .n { font:700 16px/1.2 var(--mono); letter-spacing:-.02em; }
  .stat .n.gold { color:var(--money); }
  .stat .l { font:700 8.5px/1.8 var(--cond); color:var(--dim); text-transform:uppercase; letter-spacing:.16em; }
  .note { font:500 12px/1.5 var(--mono); color:var(--hold); text-align:center; min-height:18px; }
  .soldline { text-align:center; color:var(--stop); font:800 18px/1.3 var(--cond);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }

  /* ---------- tabs ---------- */
  #tabs { position:fixed; bottom:0; left:0; right:0; z-index:10; display:flex;
    background:rgba(14,21,18,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-top:1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  #tabs button { flex:1; padding:15px 0 11px; background:none; border:none; color:var(--dim);
    font:800 14px/1 var(--cond); text-transform:uppercase; letter-spacing:.2em; position:relative; }
  #tabs button.active { color:var(--fg); }
  #tabs button.active::after { content:""; position:absolute; left:30%; right:30%; top:0; height:2px;
    background:var(--go); box-shadow:0 0 8px var(--go); }

  /* ---------- plan ---------- */
  h3 { font:800 12px/1 var(--cond); text-transform:uppercase; letter-spacing:.24em; color:var(--dim);
    margin:20px 2px 7px; padding-left:10px; border-left:3px solid var(--go); }
  .slotrow { display:flex; gap:9px; padding:7px 10px 6px; border-bottom:1px solid rgba(36,49,42,.55);
    align-items:baseline; }
  .slotrow .sl { width:48px; flex:none; font:800 10.5px/1.4 var(--cond); color:var(--dim); letter-spacing:.1em; }
  .slotrow .who { flex:1; font:700 16px/1.2 var(--cond); letter-spacing:.02em; }
  .slotrow .who .muted { font:500 10px var(--mono); }
  .slotrow .amt { font:700 14px/1.2 var(--mono); color:var(--money); }
  .open-slot { color:var(--dim); font-style:italic; font-weight:600; }
  .hint { background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--money);
    border-radius:8px; padding:10px 12px; margin:10px 0 2px; font:500 12.5px/1.6 var(--mono); }
  .hint b { color:var(--money); }
  details { border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-top:16px; background:var(--panel); }
  summary { font:800 11px/1 var(--cond); color:var(--dim); text-transform:uppercase; letter-spacing:.2em; }
  .teamrow { display:flex; font:500 12px/1.4 var(--mono); padding:7px 0 6px; border-bottom:1px solid rgba(36,49,42,.55); }
  .teamrow .tn { flex:1; font:700 14px var(--cond); letter-spacing:.03em; }
  .teamrow.me .tn { color:var(--go); }
  .muted { color:var(--dim); }
</style>
</head>
<body>
<div id="statusbar">
  <div class="st"><span class="n" id="mybudget">$200</span><span class="l">my budget</span></div>
  <div class="st plain"><span class="n" id="myslots">17</span><span class="l">open</span></div>
  <div class="st plain"><span class="n" id="infl">+0%</span><span class="l">inflation</span></div>
  <span class="spacer"></span>
  <span id="draftstate"><span class="dot" id="polldot"></span><span id="draftstatetext">…</span></span>
</div>
<div id="err"></div>
<div id="block"></div>

<div id="view-search">
  <div class="wrap">
    <input id="search" type="search" placeholder="Search player…" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div id="results"></div>
</div>

<div id="view-plan" style="display:none">
  <div class="wrap">
    <div id="targethint"></div>
    <h3>My roster</h3>
    <div id="myroster"></div>
    <h3>Best available for my open slots</h3>
    <div id="targets"></div>
    <details><summary>All team budgets</summary><div id="teams"></div></details>
  </div>
</div>

<div id="view-board" style="display:none">
  <div class="wrap">
    <button class="syncbtn" id="syncbtn" style="margin-top:2px">⟳ Sync with league</button>
    <div id="manualsec"></div>
    <h3>Draft log — newest first</h3>
    <div id="dlog"></div>
  </div>
</div>

<div id="card"><div id="cardbody"></div></div>

<div id="tabs">
  <button id="tab-search" class="active">The Block</button>
  <button id="tab-plan">My Plan</button>
  <button id="tab-board">Sync·Log</button>
</div>

<script>
"use strict";
const Q = new URLSearchParams(location.search);
const LEAGUE_ID = Q.get("league") || "1399865638406627328";
const MY_USER = Q.get("user") || "1399880454529658880";
const DRAFT_OVERRIDE = Q.get("draft");
const MOCK = Q.get("mock");
const BUDGET = 200;
const STARTERS = ["QB","RB","RB","WR","WR","TE","FLEX","SUPER_FLEX","K","DEF"];
const BENCH = 7;
const TEAMS = 10;
const SLOT_ELIG = { QB:["QB"], RB:["RB"], WR:["WR"], TE:["TE"], K:["K"], DEF:["DST"],
                    FLEX:["RB","WR","TE"], SUPER_FLEX:["QB","RB","WR","TE"] };
const API = "https://api.sleeper.app/v1";

let players = [];            // static values data, sf_rank order
let bySleeper = new Map();
let picks = [];              // raw sleeper picks (may include synthetics)
let synth = [];              // synthesized picks awaiting CDN catch-up
let draft = null;
let users = new Map();       // user_id -> display_name
let rosterOwner = new Map(); // roster_id -> user_id
let draftId = DRAFT_OVERRIDE;
let lastPickedTs = null;
let lastSig = "";
let prevMeta = null;         // last seen nomination metadata (for sold synthesis)
let manual = [];             // manual overrides [{player_id, amount, mine}]

const $ = id => document.getElementById(id);
const norm = s => (s||"").toLowerCase().normalize("NFKD").replace(/[^a-z ]/g,"");

// ---------- derived state ----------
function pickAmount(p){ const m = p.metadata||{}; return parseInt(m.amount ?? m.price ?? m.bid ?? p.amount ?? 0, 10) || 0; }
function pickOwner(p){ return p.picked_by || ownerForSlot((p.metadata||{}).slot ?? p.draft_slot) || ("slot"+(p.draft_slot ?? p.roster_id ?? "?")); }

function ownerForSlot(slot){
  if (slot==null) return null;
  const rid = draft && draft.slot_to_roster_id ? draft.slot_to_roster_id[String(slot)] : null;
  return rid!=null ? (rosterOwner.get(rid) || null) : null;
}
function slotTeamName(slot){
  const uid = ownerForSlot(slot);
  return uid ? teamName(uid) : (slot!=null ? "slot "+slot : "?");
}
function manualAsPicks(){
  return manual.map(m=>({ player_id:m.player_id, picked_by: m.mine?MY_USER:"manual_other",
    draft_slot:0, metadata:{amount:String(m.amount), manual:"1"} }));
}
function allPicks(){
  const have = new Set(picks.map(p=>String(p.player_id)));
  const extra = synth.concat(manualAsPicks()).filter(s=>!have.has(String(s.player_id)));
  const seen = new Set();
  return picks.concat(extra.filter(e=>{ const k=String(e.player_id); if(seen.has(k)||have.has(k)) return false; seen.add(k); return true; }));
}
function manualKey(){ return "manual_picks_"+(draftId||"x"); }
function loadManual(){ try { manual = JSON.parse(localStorage.getItem(manualKey())||"[]"); } catch(e){ manual=[]; } }
function saveManual(){ try { localStorage.setItem(manualKey(), JSON.stringify(manual)); } catch(e){} }
function addManual(pid, amount, mine){
  manual = manual.filter(m=>String(m.player_id)!==String(pid));
  manual.push({player_id:String(pid), amount: Math.max(1, amount|0), mine: !!mine});
  saveManual(); renderBlock(); renderAll();
}
function removeManual(pid){
  manual = manual.filter(m=>String(m.player_id)!==String(pid));
  saveManual(); renderBlock(); renderAll();
}

function derive(){
  const apicks = allPicks();
  const takenById = new Map();      // sleeper player_id -> {amount, owner}
  const spentBy = new Map();        // owner -> $
  const countBy = new Map();        // owner -> picks
  for (const p of apicks){
    const owner = pickOwner(p);
    const amt = pickAmount(p);
    takenById.set(String(p.player_id), {amount: amt, owner});
    spentBy.set(owner, (spentBy.get(owner)||0) + amt);
    countBy.set(owner, (countBy.get(owner)||0) + 1);
  }
  const totalSlots = TEAMS * (STARTERS.length + BENCH);
  const leagueOpen = Math.max(0, totalSlots - apicks.length);
  const remainingPool = TEAMS*BUDGET - [...spentBy.values()].reduce((a,b)=>a+b,0);
  // inflation: remaining $ vs baseline value of the players that will fill remaining slots
  const availVals = players.filter(p => p.sleeper_id && !takenById.has(p.sleeper_id)).map(p=>p.value)
                           .sort((a,b)=>b-a).slice(0, leagueOpen);
  const remainingValue = availVals.reduce((a,b)=>a+Math.max(b,1),0);
  const inflation = remainingValue > 0 ? remainingPool / remainingValue : 1;

  // my roster slot assignment (greedy: dedicated slot first, then FLEX/SF, then BN)
  const myPicks = apicks.filter(p => pickOwner(p) === MY_USER)
    .map(p => ({ raw:p, amount:pickAmount(p), pl: bySleeper.get(String(p.player_id)),
                 name: bySleeper.get(String(p.player_id))?.name ||
                       ((p.metadata||{}).first_name+" "+(p.metadata||{}).last_name),
                 pos: bySleeper.get(String(p.player_id))?.pos || (p.metadata||{}).position || "?" }))
    .sort((a,b)=>b.amount-a.amount);
  const slots = STARTERS.map(s => ({slot:s, fill:null}));
  for (const mp of myPicks){
    let placed = slots.find(s => !s.fill && (SLOT_ELIG[s.slot]||[]).includes(mp.pos==="DEF"?"DST":mp.pos));
    if (placed) placed.fill = mp; else slots.push({slot:"BN", fill:mp});
  }
  const bnUsed = slots.filter(s=>s.slot==="BN").length;
  for (let i=bnUsed; i<BENCH; i++) slots.push({slot:"BN", fill:null});
  const myOpen = slots.filter(s=>!s.fill).length;
  const mySpent = spentBy.get(MY_USER)||0;
  const myBudget = BUDGET - mySpent;
  const myHardCap = Math.max(1, myBudget - Math.max(0, myOpen-1));  // keep $1/slot
  const openStarter = slots.filter(s=>!s.fill && s.slot!=="BN").map(s=>s.slot);

  return {takenById, spentBy, countBy, inflation, remainingPool, leagueOpen,
          myPicks, slots, myOpen, myBudget, myHardCap, openStarter};
}

function adjVal(p, d){ return p.value<=1 ? 1 : Math.max(1, Math.round(p.value * d.inflation)); }

function scarceFor(p, d){
  const pos = p.pos==="DEF"?"DST":p.pos;
  if (pos==="QB" && (d.openStarter.includes("QB")||d.openStarter.includes("SUPER_FLEX"))) return "QB (superflex)";
  if (pos==="RB" && d.openStarter.includes("RB")) return "RB";
  return null;
}

function fillsSlot(p, d){
  const pos = p.pos==="DEF"?"DST":p.pos;
  for (const s of d.openStarter) if ((SLOT_ELIG[s]||[]).includes(pos)) return s;
  return null;
}

function recBid(p, d){
  const a = adjVal(p,d);
  const scarce = scarceFor(p,d);
  let rec = scarce ? Math.round(a*1.10) : a;
  return Math.min(rec, d.myHardCap);
}

// ---------- rendering ----------
function fmtMoney(n){ return "$"+n; }
function pipsHtml(score, cls, wrap){
  if (score==null) return "";
  const k = Math.round(score/2);
  let b = "";
  for (let i=0;i<5;i++) b += `<b class="${i<k?'on':''}"></b>`;
  return `<div class="${wrap} ${cls}">${b}</div>`;
}
function ppg(p){ return p.pts ? (p.pts/17).toFixed(1) : null; }
function rangeStr(p){ return (p.rk_min && p.rk_max) ? "#"+p.rk_min+"–"+p.rk_max : "—"; }

function renderStatus(d){
  $("mybudget").textContent = fmtMoney(d.myBudget);
  $("myslots").textContent = d.myOpen;
  const pct = d.inflation>0 ? Math.round((d.inflation-1)*100) : 0;
  $("infl").textContent = (pct>=0?"+":"")+pct+"%";
  const st = draft ? draft.status : "…";
  $("draftstatetext").textContent = st.replace("_"," ") + " · " + allPicks().length + " picks";
}

function rowHtml(p, d){
  const t = d.takenById.get(p.sleeper_id);
  const a = adjVal(p,d);
  const injTag = p.inj ? `<span class="inj">${p.inj}</span>` : "";
  const pts = ppg(p) ? ` · ${ppg(p)} ppg` : "";
  const right = t
    ? `<div class="val">SOLD ${fmtMoney(t.amount)}<small>${teamName(t.owner)}</small></div>`
    : `<div class="val">${fmtMoney(a)}<small>base ${fmtMoney(p.value)}${pts}</small></div>`;
  return `<div class="row ${t?'taken':''}" data-fp="${p.fp_id}">
    <div class="pos ${p.pos}">${p.pos}</div>
    <div class="pname">${p.name}${injTag}<small>${p.team||""} · ${p.pos_rank} · #${p.sf_rank<1000?p.sf_rank:"—"} · T${p.tier}</small></div>
    ${(p.up!=null||p.bust!=null)?`<div class="meters">${pipsHtml(p.up,'up','pips')}${pipsHtml(p.bust,'bust','pips')}</div>`:""}
    ${right}</div>`;
}

function renderSearch(){
  const d = derive();
  renderStatus(d);
  const q = norm($("search").value);
  let list;
  if (!q) {
    list = players.filter(p => !d.takenById.get(p.sleeper_id)).slice(0, 30);
  } else {
    const starts=[], subs=[];
    for (const p of players){
      const n = norm(p.name);
      if (n.startsWith(q) || n.split(" ").some(w=>w.startsWith(q))) starts.push(p);
      else if (n.includes(q)) subs.push(p);
      if (starts.length>15) break;
    }
    list = starts.concat(subs).slice(0,15);
  }
  $("results").innerHTML = list.length ? list.map(p=>rowHtml(p,d)).join("") : `<div class="noresult">no match — check spelling</div>`;
}

function teamName(owner){
  if (owner==="manual_other") return "other (manual)";
  return users.get(owner) || (owner===MY_USER?"me":String(owner).slice(0,8));
}

function openCard(fpId){
  const p = players.find(x=>x.fp_id===fpId);
  if (!p) return;
  const d = derive();
  const t = d.takenById.get(p.sleeper_id);
  const a = adjVal(p,d);
  const slot = fillsSlot(p,d);
  const scarce = scarceFor(p,d);
  const rec = recBid(p,d);
  let bidBlock;
  if (t) {
    bidBlock = `<div class="soldline">SOLD ${fmtMoney(t.amount)} → ${teamName(t.owner)}</div>`;
  } else if (!slot && d.openStarter.length>0 && p.pos!=="K" && p.pos!=="DST") {
    bidBlock = `<div class="bigbid"><div class="n">${fmtMoney(rec)}</div><div class="l">max bid · bench depth</div></div>`;
  } else {
    bidBlock = `<div class="bigbid"><div class="n">${fmtMoney(rec)}</div>
      <div class="l">my max bid · hard cap ${fmtMoney(d.myHardCap)}</div></div>`;
  }
  $("cardbody").innerHTML = `
    <h2>${p.name} ${p.inj?`<span class="inj">${p.inj}</span>`:""}</h2>
    <div class="sub">${p.team||""} · ${p.pos} · bye ${p.bye||"?"}</div>
    ${bidBlock}
    <div class="stats">
      <div class="stat"><div class="n gold">${fmtMoney(a)}</div><div class="l">adj value</div></div>
      <div class="stat"><div class="n gold">${fmtMoney(p.value)}</div><div class="l">base value</div></div>
      <div class="stat"><div class="n">${ppg(p)||"—"}</div><div class="l">proj ppg</div></div>
      <div class="stat"><div class="n">${p.pos_rank}</div><div class="l">pos rank</div></div>
      <div class="stat"><div class="n">T${p.tier}</div><div class="l">tier</div></div>
      <div class="stat"><div class="n">${rangeStr(p)}</div><div class="l">expert range</div></div>
      <div class="stat"><div class="n ${p.up>=7?'up':''}">${p.up!=null?p.up+"/10":"—"}</div>${pipsHtml(p.up,'up','statpips')}<div class="l">upside</div></div>
      <div class="stat"><div class="n ${p.bust>=7?'bust':''}">${p.bust!=null?p.bust+"/10":"—"}</div>${pipsHtml(p.bust,'bust','statpips')}<div class="l">bust risk</div></div>
      <div class="stat"><div class="n">${p.sos?p.sos+"★":"—"}</div><div class="l">sos season</div></div>
    </div>
    <div class="note">${t?"":slot?`fills your <b>${slot.replace("SUPER_FLEX","SUPERFLEX")}</b>${scarce?` · +10% scarcity (${scarce})`:""}`:"no starter slot open — bench value"}</div>
    ${manualButtons(p, t, d)}`;
  $("card").classList.add("open");
}

function manualButtons(p, t, d){
  if (!p.sleeper_id) return "";
  const isManual = manual.some(m=>String(m.player_id)===String(p.sleeper_id));
  if (t && !isManual) return "";   // real API pick — nothing to override
  if (isManual){
    return `<div class="btnrow"><button class="abtn undo" data-act="undo" data-sid="${p.sleeper_id}">Undo manual ${t&&t.owner===MY_USER?"(mine)":"(sold)"}</button></div>`;
  }
  const m = (draft && draft.metadata) || {};
  const nomBid = String(m.nominated_player_id)===String(p.sleeper_id) ? (parseInt(m.highest_offer||"0",10)||0) : 0;
  const def = nomBid || recBid(p, d);
  return `<div class="btnrow">
    <input id="mprice" type="number" inputmode="numeric" min="1" max="${BUDGET}" value="${def}">
    <button class="abtn mine" data-act="mine" data-sid="${p.sleeper_id}">＋ Mine</button>
    <button class="abtn other" data-act="other" data-sid="${p.sleeper_id}">Sold other</button>
  </div>`;
}

function renderPlan(){
  const d = derive();
  renderStatus(d);
  // roster
  $("myroster").innerHTML = d.slots.map(s => `<div class="slotrow">
      <div class="sl">${s.slot.replace("SUPER_FLEX","SFLX")}</div>
      ${s.fill? `<div class="who">${s.fill.name} <span class="muted">${s.fill.pos}</span></div><div class="amt">${fmtMoney(s.fill.amount)}</div>`
              : `<div class="who open-slot">open</div>`}
    </div>`).join("");
  // targets per open starter slot
  const seen = new Set();
  let html = "";
  let bestCliff = null;
  for (const slot of [...new Set(d.openStarter)]){
    const elig = SLOT_ELIG[slot]||[];
    const avail = players.filter(p => p.sleeper_id && !d.takenById.get(p.sleeper_id)
                                      && elig.includes(p.pos==="DEF"?"DST":p.pos))
                         .slice(0, 4);
    if (!avail.length) continue;
    const a0 = adjVal(avail[0],d), a3 = adjVal(avail[Math.min(3,avail.length-1)],d);
    const cliff = a0 - a3;
    if (!bestCliff || cliff > bestCliff.cliff) bestCliff = {slot, cliff, top: avail[0]};
    html += `<h3>${slot.replace("SUPER_FLEX","SUPERFLEX")}</h3>` +
      avail.filter(p=>{const k=p.fp_id; if(seen.has(k))return false; seen.add(k); return true;})
           .map(p=>rowHtml(p,d)).join("");
  }
  $("targets").innerHTML = html || `<div class="muted" style="padding:8px 12px">all starter slots filled — hunt bench value</div>`;
  $("targethint").innerHTML = bestCliff && draft && draft.status==="drafting"
    ? `<div class="hint">Biggest cliff: <b>${bestCliff.slot.replace("SUPER_FLEX","SUPERFLEX")}</b> — after ${bestCliff.top.name} (${fmtMoney(adjVal(bestCliff.top,d))}) value drops ${fmtMoney(bestCliff.cliff)}. Budget ${fmtMoney(d.myBudget)} across ${d.myOpen} slots.</div>`
    : "";
  // team budgets
  const owners = [...new Set([MY_USER, ...allPicks().map(pickOwner)])];
  $("teams").innerHTML = owners.map(o=>{
    const spent = d.spentBy.get(o)||0, cnt = d.countBy.get(o)||0;
    const open = STARTERS.length+BENCH-cnt;
    const cap = Math.max(0, BUDGET-spent - Math.max(0,open-1));
    return `<div class="teamrow ${o===MY_USER?'me':''}"><div class="tn">${teamName(o)}</div>
      <div>${fmtMoney(BUDGET-spent)} · ${cnt}/17 · max ${fmtMoney(cap)}</div></div>`;
  }).join("");
}

function renderBoard(){
  const d = derive();
  renderStatus(d);
  $("manualsec").innerHTML = (!manual.length
    ? `<h3>Manual entries</h3><div class="noresult" style="padding:14px">none yet — open a player card and tap <b>＋ Mine</b> or <b>Sold other</b></div>`
    : `<h3>Manual entries (${manual.length})</h3>`) + manual.map(m=>{
      const pl = bySleeper.get(String(m.player_id));
      return `<div class="mrow">
        <span class="tag ${m.mine?'mine':'other'}">${m.mine?'MINE':'OTHER'}</span>
        <div class="mn">${pl?pl.name:m.player_id}</div>
        <div class="ma">${fmtMoney(m.amount)}</div>
        <button class="mx" data-msid="${m.player_id}">✕</button>
      </div>`;
    }).join("");
  const log = allPicks().slice().sort((a,b)=>(b.pick_no||9999)-(a.pick_no||9999));
  $("dlog").innerHTML = log.length ? log.map(pk=>{
    const pl = bySleeper.get(String(pk.player_id));
    const nm = pl ? pl.name : ((pk.metadata||{}).first_name+" "+(pk.metadata||{}).last_name);
    const pos = pl ? pl.pos : ((pk.metadata||{}).position||"?");
    const own = pickOwner(pk);
    const man = (pk.metadata||{}).manual ? " ·manual" : ((pk.metadata||{}).synthetic ? " ·pending" : "");
    return `<div class="mrow" ${pl?`data-fp="${pl.fp_id}"`:""}>
      <span class="tag ${own===MY_USER?'mine':'other'}" style="min-width:34px;text-align:center">${pk.pick_no||"—"}</span>
      <div class="mn">${nm} <span class="muted" style="font:500 10px var(--mono)">${pos}${man}</span></div>
      <div class="ma">${fmtMoney(pickAmount(pk))}</div>
      <div class="muted" style="font:500 10px var(--mono)">${teamName(own)}</div>
    </div>`;
  }).join("") : `<div class="noresult">no picks yet</div>`;
}

function renderAll(){
  if ($("view-search").style.display!=="none") renderSearch();
  else if ($("view-plan").style.display!=="none") renderPlan();
  else renderBoard();
}

// ---------- data loading / polling ----------
async function j(url){
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error(r.status+" "+url);
  return r.json();
}

function showErr(msg){
  const e = $("err");
  if (!msg){ e.style.display="none"; return; }
  e.textContent = msg; e.style.display="block";
}

async function loadStatic(){
  players = await j("players.json?v=3");
  bySleeper = new Map(players.filter(p=>p.sleeper_id).map(p=>[p.sleeper_id, p]));
}

async function loadLeague(){
  try {
    const us = await j(`${API}/league/${LEAGUE_ID}/users`);
    users = new Map(us.map(u=>[u.user_id, u.display_name]));
  } catch(e){ /* names are cosmetic */ }
  try {
    const rs = await j(`${API}/league/${LEAGUE_ID}/rosters`);
    rosterOwner = new Map(rs.map(r=>[r.roster_id, r.owner_id]));
  } catch(e){ /* slot attribution degrades to slot numbers */ }
  if (!draftId){
    const ds = await j(`${API}/league/${LEAGUE_ID}/drafts`);
    const d = ds.find(x=>x.status!=="complete") || ds[0];
    draftId = d.draft_id;
    draft = d;
  }
}

// Fast loop: /draft/<id> is the near-realtime source (nomination + high bid +
// last_picked). /picks sits behind a CDN (s-maxage=30, SWR=300) so it can lag
// minutes on a live draft — cache-bust it, verify it grew, and synthesize the
// sold pick from nomination metadata while waiting.
async function fastLoop(){
  try {
    draft = MOCK ? mockDraft() : await j(`${API}/draft/${draftId}?_=${Date.now()}`);
    $("polldot").classList.add("ok");
    showErr("");
    const m = draft.metadata || {};
    if (draft.last_picked && draft.last_picked !== lastPickedTs){
      const first = lastPickedTs === null;   // page load: no sale actually observed
      lastPickedTs = draft.last_picked;
      if (!first){
        synthesizeSold();
        refreshPicks(4);
      }
    }
    if (m.nominated_player_id) prevMeta = m;
    const sig = [draft.status, m.nominated_player_id, m.highest_offer, m.offering_slot,
                 allPicks().length, $("search").value].join("|");
    if (sig !== lastSig){ lastSig = sig; renderBlock(); renderAll(); }
  } catch(e){
    $("polldot").classList.remove("ok");
    showErr("draft fetch failed: "+e.message);
  }
}

function synthesizeSold(){
  // last_picked changed: prevMeta holds the nomination that just resolved
  if (!prevMeta || !prevMeta.nominated_player_id) return;
  const pid = String(prevMeta.nominated_player_id);
  if (picks.some(p=>String(p.player_id)===pid)) return;
  synth.push({
    player_id: pid,
    picked_by: ownerForSlot(prevMeta.offering_slot) || "",
    draft_slot: parseInt(prevMeta.offering_slot||"0",10),
    metadata: { amount: prevMeta.highest_offer || "1", slot: prevMeta.offering_slot,
                synthetic: "1" },
  });
}

async function refreshPicks(retries){
  const before = picks.length;
  try {
    picks = MOCK ? mockPicks() : await j(`${API}/draft/${draftId}/picks?_=${Date.now()}`);
    const have = new Set(picks.map(p=>String(p.player_id)));
    synth = synth.filter(s=>!have.has(String(s.player_id)));
  } catch(e){ /* keep last good */ }
  if (picks.length <= before && retries > 0){
    setTimeout(()=>refreshPicks(retries-1), 4000);
  }
  renderBlock(); renderAll();
}

function renderBlock(){
  const el = $("block");
  const m = (draft && draft.metadata) || {};
  if (!draft || draft.status !== "drafting" || !m.nominated_player_id){
    el.className = ""; el.innerHTML = ""; return;
  }
  const d = derive();
  const pid = String(m.nominated_player_id);
  const p = bySleeper.get(pid);
  const bid = parseInt(m.highest_offer || "0", 10) || 0;
  const bidder = slotTeamName(m.offering_slot);
  const sold = d.takenById.has(pid);
  let verdict, vclass;
  if (sold){ verdict = "SOLD"; vclass = "SOLD"; }
  else if (!p){ verdict = ""; vclass = ""; }
  else {
    const rec = recBid(p, d);
    if (bid < rec){ verdict = "BID ≤ $" + rec; vclass = "BID"; }
    else if (bid === rec){ verdict = "AT MAX"; vclass = "MAX"; }
    else { verdict = "PASS"; vclass = "PASS"; }
  }
  const name = p ? p.name : "player " + pid;
  const sub = p ? `${p.team||""} ${p.pos} · adj ${fmtMoney(adjVal(p,d))} · ${p.pos_rank} T${p.tier}${ppg(p)?` · ${ppg(p)} ppg`:""}${p.up!=null?` · up ${p.up}`:""}${p.bust!=null?` · bust ${p.bust}`:""}` : "not in rankings — likely $1 dart";
  const hover = (m.hovered_player_id && m.hovered_player_id !== pid && bySleeper.get(String(m.hovered_player_id)))
    ? ` · hovering: ${bySleeper.get(String(m.hovered_player_id)).name}` : "";
  el.innerHTML = `<span class="livetag">On the block</span>
    <div class="toprow" ${p?`data-fp="${p.fp_id}"`:""}>
      <div class="bname">${name}</div>
      <div class="bid">$${bid}</div>
      ${verdict?`<div class="verdict ${vclass}">${verdict}</div>`:""}
    </div>
    <div class="sub2">high: ${bidder} · ${sub}${hover}</div>`;
  el.className = "show";
}

function mockPicks(){
  // ?mock=N takes the top N players as fake picks at ~value prices, round-robin owners
  const n = parseInt(MOCK,10)||25;
  const owners = ["1399880454529658880","743253553073754112","886058514131599360","1125335302740008960","1135396859960610816"];
  return players.filter(p=>p.sleeper_id).slice(0,n).map((p,i)=>({
    player_id: p.sleeper_id, draft_slot: (i%10)+1,
    picked_by: owners[i%owners.length],
    metadata: {amount: String(Math.max(1, p.value + ((i%5)-2))), first_name:p.name.split(" ")[0], last_name:p.name.split(" ").slice(1).join(" "), position:p.pos}
  }));
}

function mockDraft(){
  const n = parseInt(MOCK,10)||25;
  const nom = players.filter(p=>p.sleeper_id).slice(n)[0];   // first untaken
  const hov = players.filter(p=>p.sleeper_id).slice(n+3)[0];
  return { status:"drafting", last_picked: n,
    slot_to_roster_id: null,
    metadata: { nominated_player_id: nom.sleeper_id, highest_offer: "7",
                offering_slot: "3", nominating_slot: "5",
                hovered_player_id: hov.sleeper_id } };
}

// ---------- wiring ----------
$("search").addEventListener("input", renderSearch);
$("results").addEventListener("click", e=>{
  const r = e.target.closest(".row"); if (r) openCard(r.dataset.fp);
});
$("targets").addEventListener("click", e=>{
  const r = e.target.closest(".row"); if (r) openCard(r.dataset.fp);
});
$("card").addEventListener("click", e=>{ if (e.target.id==="card") $("card").classList.remove("open"); });
$("cardbody").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (!b) return;
  const sid = b.dataset.sid;
  if (b.dataset.act==="undo"){ removeManual(sid); }
  else {
    const amt = parseInt(($("mprice")||{}).value, 10) || 1;
    addManual(sid, amt, b.dataset.act==="mine");
  }
  $("card").classList.remove("open");
});
const TABS = [["tab-search","view-search",renderSearch],["tab-plan","view-plan",renderPlan],["tab-board","view-board",renderBoard]];
for (const [tid, vid, fn] of TABS){
  $(tid).addEventListener("click", ()=>{
    for (const [t2, v2] of TABS){ $(v2).style.display = v2===vid ? "" : "none"; $(t2).classList.toggle("active", t2===tid); }
    fn();
  });
}
$("block").addEventListener("click", e=>{
  const r = e.target.closest(".toprow"); if (r && r.dataset.fp) openCard(r.dataset.fp);
});
$("manualsec").addEventListener("click", e=>{
  const b = e.target.closest("[data-msid]"); if (b) removeManual(b.dataset.msid);
});
$("syncbtn").addEventListener("click", ()=>{
  const n = manual.length;
  if (n && !confirm(`Clear ${n} manual entr${n===1?"y":"ies"} and re-sync from Sleeper?`)) return;
  manual = []; saveManual(); synth = []; lastSig = "";
  refreshPicks(2); fastLoop();
});
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ fastLoop(); refreshPicks(0); } });

(async function init(){
  try {
    await loadStatic();
    await loadLeague();
    loadManual();
    await refreshPicks(0);
    await fastLoop();
    setInterval(fastLoop, 1500);        // nomination + high bid + sold detector
    setInterval(()=>refreshPicks(0), 20000);  // slow reconcile of the pick list
  } catch(e){ showErr("init failed: "+e.message); }
})();
</script>
